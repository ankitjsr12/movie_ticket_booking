<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Your Seats • Cinema Booking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-black text-white min-h-screen">

<nav class="bg-black border-b border-red-800 sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
    <div onclick="window.location.href='index.html'" class="flex items-center gap-3 cursor-pointer">
      <span class="text-4xl">🎟️</span>
      <div>
        <h1 class="text-3xl font-bold tracking-tighter">CINEMA</h1>
        <p class="text-red-500 text-sm -mt-1">BOOKING TICKET</p>
      </div>
    </div>

    <div class="hidden md:flex items-center gap-8 text-lg font-medium">
      <a href="movies.html" class="hover:text-red-500">Movies</a>
      <a href="shows.html" class="hover:text-red-500">Shows</a>
      <a href="theatres.html" class="hover:text-red-500">Theatres</a>
      <a href="coupons.html" class="hover:text-red-500">Coupons</a>
      <a href="history.html" class="hover:text-red-500">My Bookings</a>
    </div>

    <div class="flex items-center gap-4">
      <button onclick="toggleTheme()" class="text-2xl px-3 py-2 rounded-xl hover:bg-gray-800 transition">
        <i id="theme-icon" class="fas fa-moon"></i>
      </button>
      <div id="user-section" class="hidden md:flex items-center gap-3">
        <i class="fas fa-user-circle text-3xl text-red-400"></i>
        <span id="user-name-display" class="font-semibold"></span>
      </div>
      <button onclick="logout()" class="bg-red-600 hover:bg-red-700 px-6 py-3 rounded-2xl font-semibold flex items-center gap-2">
        <i class="fas fa-sign-out-alt"></i> Logout
      </button>
    </div>
  </div>
</nav>

<div class="max-w-5xl mx-auto px-6 py-8">
    <h1 id="movie-name" class="text-3xl font-bold text-center mb-2"></h1>
    <p id="theatre-name" class="text-red-400 text-center text-sm font-medium"></p>

    <div class="text-center mb-6">
        <select id="theatre-select" class="bg-gray-900 text-white border border-red-800 rounded-2xl px-6 py-4 text-lg w-full max-w-md mx-auto">
            <option value="PVR INOX South City Mall">PVR INOX South City Mall, Kolkata</option>
            <option value="INOX Forum Mall">INOX Forum Mall, Kolkata</option>
            <option value="Cinepolis Acropolis">Cinepolis Acropolis Mall, Kolkata</option>
        </select>
    </div>

    <div id="seat-map" class="text-center mb-12"></div>

    <div class="flex justify-between items-center bg-gray-900 p-6 rounded-3xl max-w-2xl mx-auto">
        <div>
            <span class="text-lg">Selected Seats:</span>
            <span id="selected-seats" class="text-amber-400 font-bold text-2xl ml-2"></span>
        </div>
        <button onclick="confirmBooking()" class="bg-red-600 hover:bg-red-700 px-12 py-6 text-2xl font-bold rounded-2xl">
            Buy Tickets • ₹<span id="total">0</span>
        </button>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const movieName = urlParams.get('movie') || "Doctor Strange";
    document.getElementById('movie-name').innerText = movieName;

    let selectedSeats = [];
    let selectedTime = "7:00 PM";
    const pricePerSeat = 280;

    function renderSeats() {
        const container = document.getElementById('seat-map');
        let html = '';
        for(let row = 1; row <= 7; row++) {
            html += `<div class="flex justify-center mb-3 items-center gap-1">`;
            html += `<span class="w-8 text-red-400 font-bold">${String.fromCharCode(64 + row)}</span>`;
            for(let col = 1; col <= 12; col++) {
                const seat = String.fromCharCode(64 + row) + col;
                html += `<div onclick="toggleSeat('${seat}')" class="w-9 h-9 flex items-center justify-center font-bold rounded-xl cursor-pointer text-sm ${selectedSeats.includes(seat) ? 'bg-cyan-400 text-black scale-110' : 'bg-gray-700 hover:bg-red-500'}">${col}</div>`;
            }
            html += `</div>`;
        }
        container.innerHTML = html;
    }

    function toggleSeat(seat) {
        if(selectedSeats.includes(seat)) selectedSeats = selectedSeats.filter(s => s !== seat);
        else selectedSeats.push(seat);
        renderSeats();
        document.getElementById('total').innerText = selectedSeats.length * pricePerSeat;
        document.getElementById('selected-seats').innerText = selectedSeats.join(", ") || "None";
    }

    function confirmBooking() {
        if(selectedSeats.length === 0) {
            alert("Please select at least one seat!");
            return;
        }

        const total = selectedSeats.length * pricePerSeat;
        const theatre = document.getElementById('theatre-select').value;

        const booking = {
            id: "MTBS-" + Math.floor(100000 + Math.random() * 900000),
            movie: movieName,
            date: "07 April 2026",
            time: selectedTime,
            seats: selectedSeats.join(", "),
            amount: total,
            theatre: theatre,
            status: "Confirmed"
        };

        // Save to localStorage
        let bookings = JSON.parse(localStorage.getItem("myBookings")) || [];
        bookings.unshift(booking);   // newest first
        localStorage.setItem("myBookings", JSON.stringify(bookings));

        alert(`✅ Ticket Booked Successfully!\nTicket ID: ${booking.id}`);
        window.location.href = `confirmation.html?movie=${encodeURIComponent(movieName)}&theatre=${encodeURIComponent(theatre)}&seats=${selectedSeats.join(",")}&total=${total}&time=${selectedTime}`;
    }

    renderSeats();
</script>
</body>
</html>
