<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movies - Cinema Booking Ticket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background: linear-gradient(to bottom, #1a0000, #000000);
      }
      .movie-card {
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .movie-card:hover {
        transform: scale(1.08) translateY(-8px);
        box-shadow: 0 25px 50px -12px rgb(239 68 68);
      }
    </style>
  </head>
  <body class="text-white">
    <!-- NAVBAR -->
    <nav class="bg-black border-b border-red-800 sticky top-0 z-50">
      <div
        class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between"
      >
        <div
          onclick="window.location.href = 'index.html'"
          class="flex items-center gap-3 cursor-pointer"
        >
          <span class="text-4xl">🎟️</span>
          <div>
            <h1 class="text-3xl font-bold tracking-tighter">CINEMA</h1>
            <p class="text-red-500 text-sm -mt-1">BOOKING TICKET</p>
          </div>
        </div>

        <div class="hidden md:flex items-center gap-8 text-lg font-medium">
          <a href="movies.html" class="hover:text-red-500">Movies</a>
          <a href="shows.html" class="hover:text-red-500">Shows</a>
          <a href="theatres.html" class="hover:text-red-500">Theatres</a>
          <a href="coupons.html" class="hover:text-red-500">Coupons</a>
          <a href="history.html" class="hover:text-red-500">My Bookings</a>
        </div>

        <div class="flex items-center gap-4">
          <button
            onclick="toggleTheme()"
            class="text-3xl px-4 py-2 rounded-2xl hover:bg-gray-800 transition-all active:scale-95"
          >
            <i id="theme-icon" class="fas fa-moon"></i>
          </button>
          <div id="user-section" class="hidden md:flex items-center gap-3">
            <i class="fas fa-user-circle text-3xl text-red-400"></i>
            <span id="user-name-display" class="font-semibold"></span>
          </div>
          <button
            onclick="logout()"
            class="bg-red-600 hover:bg-red-700 px-6 py-3 rounded-2xl font-semibold flex items-center gap-2"
          >
            <i class="fas fa-sign-out-alt"></i> Logout
          </button>
        </div>
      </div>
    </nav>

    <div class="max-w-7xl mx-auto px-6 py-12">
      <h1 class="text-5xl font-bold mb-10 text-red-500 text-center">
        Now Showing in Kolkata
      </h1>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-8" id="movies"></div>
    </div>

    <script>
      const movies = [
        {
          title: "Doctor Strange in the Multiverse of Madness",
          image: "/images/doctorstrange.jpg",
          time: "7:00 PM",
          price: 280,
        },
        {
          title: "Deadpool & Wolverine",
          image: "/images/Deadpool.jpeg",
          time: "9:30 PM",
          price: 250,
        },
        {
          title: "Dune: Part Two",
          image: "/images/dune.jpeg",
          time: "6:15 PM",
          price: 320,
        },
        {
          title: "Kingdom of the Planet of the Apes",
          image: "/images/planet-of-the-apes.jpeg",
          time: "8:45 PM",
          price: 220,
        },
        {
          title: "Oppenheimer",
          image: "/images/oppenheimer.jpeg",
          time: "5:00 PM",
          price: 290,
        },
        {
          title: "Joker: Folie à Deux",
          image: "/images/joker.jpeg",
          time: "10:00 PM",
          price: 260,
        },
        {
          title: "Furiosa: A Mad Max Saga",
          image: "/images/furiosa.jpeg",
          time: "7:30 PM",
          price: 240,
        },
        {
          title: "Challengers",
          image: "/images/challengers.jpeg",
          time: "6:45 PM",
          price: 210,
        },
      ];

      document.getElementById("movies").innerHTML = movies
        .map(
          (m) => `
        <div onclick="window.location='seat-selection.html?movie=${encodeURIComponent(m.title)}'" 
             class="movie-card bg-gray-900 rounded-3xl overflow-hidden cursor-pointer">
            <img src="${m.image}" alt="${m.title}" class="w-full h-80 object-cover">
            <div class="p-6">
                <h3 class="font-bold text-lg">${m.title}</h3>
                <p class="text-red-400">${m.time} • ₹${m.price}</p>
            </div>
        </div>
    `,
        )
        .join("");

      function toggleTheme() {
        document.documentElement.classList.toggle("dark");
        const icon = document.getElementById("theme-icon");
        if (document.documentElement.classList.contains("dark")) {
          icon.classList.replace("fa-moon", "fa-sun");
          localStorage.setItem("theme", "dark");
        } else {
          icon.classList.replace("fa-sun", "fa-moon");
          localStorage.setItem("theme", "light");
        }
      }

      function logout() {
        if (confirm("Logout karna chahte ho?")) {
          localStorage.clear();
          window.location.href = "login.html";
        }
      }

      window.onload = () => {
        const name = localStorage.getItem("userName");
        if (name) {
          document.getElementById("user-name-display").innerText = name;
          document.getElementById("user-section").classList.remove("hidden");
          document.getElementById("user-section").classList.add("flex");
        }
      };
    </script>
  </body>
</html>
